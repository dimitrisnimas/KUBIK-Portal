services:
  - type: web
    name: kubik-portal-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Demo__Enabled
        value: true
      - key: ConnectionStrings__Portal
        sync: false
      - key: Demo__OtpHashSecret
        generateValue: true
      - key: Brevo__ApiKey
        sync: false
      - key: Brevo__FromAddress
        sync: false
      - key: Brevo__FromName
        value: KUBIK Portal Demo
