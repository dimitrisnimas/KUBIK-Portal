services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kubik_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubik_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kubik-postgres:/var/lib/postgresql/data

volumes:
  kubik-postgres:
